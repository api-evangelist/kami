aid: kami
name: KAMI
description: >-
  KAMI (Çizgi Studio) is a next-generation transmedia entertainment platform out
  of Turkey that lets a community read, write, and live inside stories. The mobile
  app and web platform offer thousands of original webtoons, comics (çizgi roman),
  novels, and AI-character chat across genres like romance, thriller, fantasy, and
  horror, plus vertical drama viewing. Community-validated narratives are measured
  through read rates, micro-transactions, and engagement, then graduate into
  vertical-drama production and licensable intellectual property — a "story IP
  engine." KAMI is a consumer product (2.5M+ users) with no public developer API;
  it is part of the wearekami.com ecosystem and a 500 Global Creators Ventures
  portfolio company, added to the API Evangelist network for enrichment.
